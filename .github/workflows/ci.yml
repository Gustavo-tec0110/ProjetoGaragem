name: Qualidade contínua

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar lint
        run: npm run lint
      - name: Executar testes unitários
        run: npm run test:unit
      - name: Validar SQL e bootstrap em PostgreSQL isolado
        run: npm run test:sql
      - name: Verificar tipos
        run: npm run typecheck
      - name: Gerar build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      PROFILE_IMAGE_EDITOR_TEST_HARNESS: "1"
      MODIFICATION_PHOTOS_TEST_HARNESS: "1"
      SKELETON_VISUAL_TEST: "1"
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Gerar build para os testes E2E
        run: npm run build
      - name: Executar testes públicos
        run: npm run test:e2e
